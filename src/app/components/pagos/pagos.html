<div class="row justify-content-center">
  <div class="col-md-8">

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Deudas Pendientes</h5>
        <button class="btn btn-light btn-sm" (click)="cargarDeudas()">
          <i class="bi bi-arrow-clockwise"></i> Actualizar
        </button>
      </div>
      <div class="card-body p-0">
        <div class="text-center py-4" *ngIf="cargandoDeudas">
          <div class="spinner-border text-success"></div>
          <div class="text-muted mt-2">Cargando deudas...</div>
        </div>
        <div class="text-center py-4 text-muted" *ngIf="!cargandoDeudas && deudas.length === 0">
          No hay deudas pendientes.
        </div>
        <div class="table-responsive" *ngIf="!cargandoDeudas && deudas.length > 0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Monto</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              @for (d of deudas; track d.id) {
                <tr [class.table-success]="pago.deudaId === d.id">
                  <td>{{ d.id }}</td>
                  <td>{{ d.codigo }}</td>
                  <td>S/ {{ d.monto }}</td>
                  <td><span class="badge bg-warning text-dark">{{ d.estado }}</span></td>
                  <td>
                    <button class="btn btn-outline-success btn-sm" (click)="seleccionarDeuda(d)">
                      Seleccionar
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">Registrar Pago</h5>
      </div>
      <div class="card-body">
        <div class="alert alert-success" *ngIf="mensaje">{{ mensaje }}</div>
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

        <div class="mb-3">
          <label class="form-label">Deuda seleccionada</label>
          <input type="number" class="form-control" [(ngModel)]="pago.deudaId"
            placeholder="Selecciona una deuda de la tabla o escribe el ID" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Monto a pagar (S/)</label>
          <input type="number" class="form-control" [(ngModel)]="pago.monto" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Medio de Pago <span class="text-danger">*</span></label>
          <select class="form-select"
            [value]="pago.medioPago"
            (change)="pago.medioPago = $any($event.target).value">
            <option value="">Seleccionar...</option>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo de Comprobante <span class="text-danger">*</span></label>
          <select class="form-select"
            [value]="pago.tipoComprobante"
            (change)="pago.tipoComprobante = $any($event.target).value">
            <option value="">Seleccionar...</option>
            <option value="boleta">Boleta</option>
            <option value="factura">Factura</option>
          </select>
        </div>
        <button class="btn btn-success w-100" (click)="registrar()">Registrar Pago</button>
      </div>
    </div>

  </div>
</div>
